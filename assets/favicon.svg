<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1b2a"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="26%" r="65%">
      <stop offset="0%" stop-color="#29b6f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#29b6f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="55%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eef3f8"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- rotating-ring style border -->
  <rect x="20" y="20" width="472" height="472" rx="98" fill="none" stroke="url(#ring)" stroke-width="14"/>

  <!-- RA initials -->
  <text x="256" y="300" font-family="Poppins, 'DejaVu Sans', Arial, sans-serif" font-weight="800"
        font-size="228" text-anchor="middle" fill="url(#text)" letter-spacing="-6">RA</text>

  <!-- terminal cursor accent -->
  <rect x="176" y="336" width="160" height="14" rx="7" fill="#29b6f6"/>
</svg>
